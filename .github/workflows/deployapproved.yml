name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

    # ------------------------
    # Descargar proyecto
    # ------------------------

    - name: Checkout
      uses: actions/checkout@v4

    # ------------------------
    # Node
    # ------------------------

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Instalar dependencias Node
      run: npm install

    # ------------------------
    # Playwright
    # ------------------------

    - name: Instalar Playwright
      run: npx playwright install --with-deps

    - name: Ejecutar pruebas E2E
      id: playwright
      continue-on-error: true
      env:
        BASE_URL: http://${{ secrets.EC2_HOST }}:8000
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: |
        npx playwright test --reporter=json > playwright-results.json

    - name: Resumir Playwright
      if: always()
      run: |
        node scripts/parse-playwright-report.mjs playwright-results.json playwright-summary.json

    # ------------------------
    # Guardar reporte
    # ------------------------

    - name: Subir reporte Playwright
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/

    - name: Copiar resumen Playwright al EC2
      if: always()
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: playwright-summary.json
        target: /var/www/html/La-Confianza/storage/app/monitor/

    # ------------------------
    # Docker Login
    # ------------------------

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    # ------------------------
    # Build
    # ------------------------

    - name: Build Docker Image
      run: |
        docker build -t robertsl/la-confianza:latest .

    # ------------------------
    # Push Docker Hub
    # ------------------------

    - name: Push Docker Hub
      run: |
        docker push robertsl/la-confianza:latest

    # ------------------------
    # Deploy EC2
    # ------------------------

    - name: Deploy EC2
      if: ${{ steps.playwright.outcome == 'success' }}
      uses: appleboy/ssh-action@v1.2.0

      with:

        host: ${{ secrets.EC2_HOST }}

        username: ${{ secrets.EC2_USER }}

        key: ${{ secrets.EC2_KEY }}

        script: |

          cd /var/www/html/La-Confianza

          mkdir -p storage/app/monitor

          DEPLOY_LOG=storage/app/monitor/deploy.log
          DEPLOY_META=storage/app/monitor/deploy.json

          {
            echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Deploy iniciado"
            echo "Branch: main"

            git pull origin main

            docker pull robertsl/la-confianza:latest

            docker compose down

            docker compose up -d

            docker exec la-confianza php artisan optimize:clear

            docker image prune -af

            docker builder prune -af

            sudo find /var/lib/docker/containers/ -name "*-json.log" -exec truncate -s 0 {} \;

            echo "===== Contenedores ====="

            docker ps

            echo "===== Logs Laravel ====="

            docker exec la-confianza tail -20 storage/logs/laravel.log || true

            echo "===== Estado Docker ====="

            docker stats --no-stream

            echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Deploy finalizado"
          } | tee "$DEPLOY_LOG"

          cat > "$DEPLOY_META" <<'EOF'
          {
            "status": "success",
            "status_label": "Deploy aplicado correctamente",
            "branch": "main",
            "commit": "${{ github.sha }}",
            "updated_at": "${{ github.run_started_at }}"
          }
          EOF
