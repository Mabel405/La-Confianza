name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

    # ------------------------
    # Descargar proyecto
    # ------------------------

    - name: Checkout
      uses: actions/checkout@v4

    # ------------------------
    # Node
    # ------------------------

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Instalar dependencias Node
      run: npm install

    # ------------------------
    # Playwright
    # ------------------------

    - name: Instalar Playwright
      run: npx playwright install --with-deps

    - name: Ejecutar pruebas E2E
      id: playwright
      continue-on-error: true
      env:
        BASE_URL: http://${{ secrets.EC2_HOST }}:8000
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: |
        npx playwright test --reporter=json > playwright-results.json

    - name: Resumir Playwright
      if: always()
      run: |
        node scripts/parse-playwright-report.mjs playwright-results.json playwright-summary.json

    # ------------------------
    # Guardar reporte
    # ------------------------

    - name: Subir reporte Playwright
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/

    - name: Preparar carpeta de monitor en EC2
      if: always()
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          mkdir -p /var/www/html/La-Confianza/storage/app/monitor

    - name: Copiar resumen Playwright al EC2
      if: always()
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: playwright-summary.json
        target: /var/www/html/La-Confianza/storage/app/monitor/

    # ------------------------
    # Docker Login
    # ------------------------

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    # ------------------------
    # Build
    # ------------------------

    - name: Build Docker Image
      run: |
        docker build -t robertsl/la-confianza:latest .

    # ------------------------
    # Push Docker Hub
    # ------------------------

    - name: Push Docker Hub
      run: |
        docker push robertsl/la-confianza:latest

    # ------------------------
    # Deploy EC2
    # ------------------------

    - name: Deploy EC2
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}

        script: |
          set -Eeuo pipefail

          cd /var/www/html/La-Confianza

          mkdir -p storage/app/monitor

          DEPLOY_LOG=storage/app/monitor/deploy.log
          DEPLOY_META=storage/app/monitor/deploy.json

          exec > >(tee "$DEPLOY_LOG") 2>&1

          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Deploy iniciado"
          echo "Commit esperado: ${{ github.sha }}"
          echo "Repositorio: $(git remote get-url origin)"

          git fetch origin main
          git reset --hard origin/main

          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "Commit desplegado: $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "${{ github.sha }}" ]; then
            echo "ERROR: EC2 no quedó en el commit esperado"
            exit 1
          fi

          docker compose pull
          docker compose up -d --force-recreate --remove-orphans

          docker exec la-confianza php artisan optimize:clear

          echo "===== Contenedores ====="
          docker compose ps

          echo "===== Logs Laravel ====="
          docker exec la-confianza tail -20 storage/logs/laravel.log || true

          cat > "$DEPLOY_META" <<EOF
          {
            "status": "success",
            "status_label": "Deploy aplicado correctamente",
            "branch": "main",
            "commit": "${{ github.sha }}",
            "updated_at": "${{ github.run_started_at }}"
          }
          EOF

          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Deploy finalizado"