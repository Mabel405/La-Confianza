name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build Image
      run: |
        docker build -t robertsl/la-confianza:latest .

    - name: Push Docker Hub
      run: |
        docker push robertsl/la-confianza:latest

    - name: Deploy EC2
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd /var/www/html/La-Confianza

          docker pull robertsl/la-confianza:latest

          docker compose down

          docker compose up -d