name: Laravel CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: laravel-production-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # --------------------------------------------------
      # Descargar proyecto
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias Node
        run: npm ci

      # --------------------------------------------------
      # Playwright
      # --------------------------------------------------

      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: Verificar acceso a la aplicación
        id: app_check
        continue-on-error: true
        env:
          BASE_URL: http://${{ secrets.EC2_HOST }}:8000
        run: |
          set -Eeuo pipefail

          echo "Verificando disponibilidad de: ${BASE_URL}"

          curl \
            --fail \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            "${BASE_URL}"

          echo "La aplicación responde correctamente."

      - name: Ejecutar pruebas E2E
        id: playwright
        if: steps.app_check.outcome == 'success'
        continue-on-error: true
        env:
          CI: true
          BASE_URL: http://${{ secrets.EC2_HOST }}:8000
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "Ejecutando pruebas contra ${BASE_URL}"

          npx playwright test

      # --------------------------------------------------
      # Preparar resultados Playwright
      # --------------------------------------------------

      - name: Crear resultado cuando EC2 no responde
        if: always() && steps.app_check.outcome == 'failure'
        run: |
          cat > playwright-results.json <<'EOF'
          {
            "config": {},
            "suites": [],
            "errors": [
              {
                "message": "La aplicación EC2 no respondió en la URL configurada."
              }
            ],
            "stats": {
              "startTime": "",
              "duration": 0,
              "expected": 0,
              "skipped": 0,
              "unexpected": 1,
              "flaky": 0
            }
          }
          EOF

      - name: Verificar archivo JSON de Playwright
        if: always()
        run: |
          if [ ! -s playwright-results.json ]; then
            echo "Playwright no generó playwright-results.json."

            cat > playwright-results.json <<'EOF'
          {
            "config": {},
            "suites": [],
            "errors": [
              {
                "message": "Playwright no generó un reporte JSON válido."
              }
            ],
            "stats": {
              "startTime": "",
              "duration": 0,
              "expected": 0,
              "skipped": 0,
              "unexpected": 1,
              "flaky": 0
            }
          }
          EOF
          fi

      - name: Generar resumen Playwright
        if: always()
        continue-on-error: true
        run: |
          if [ -f scripts/parse-playwright-report.mjs ]; then
            node scripts/parse-playwright-report.mjs \
              playwright-results.json \
              playwright-summary.json
          else
            echo "No existe scripts/parse-playwright-report.mjs."

            cat > playwright-summary.json <<'EOF'
          {
            "status": "unknown",
            "status_label": "No se encontró el script para generar el resumen"
          }
          EOF
          fi

      # --------------------------------------------------
      # Guardar reportes
      # --------------------------------------------------

      - name: Subir reportes Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-results.json
            playwright-summary.json
            playwright-report/
            test-results/

      - name: Preparar carpeta de monitor en EC2
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -Eeuo pipefail

            sudo mkdir -p \
              /var/www/html/La-Confianza/storage/app/monitor

            sudo chown "$USER":www-data \
              /var/www/html/La-Confianza/storage/app/monitor

            sudo chmod 2775 \
              /var/www/html/La-Confianza/storage/app/monitor

      - name: Copiar resumen Playwright al EC2
        if: always() && hashFiles('playwright-summary.json') != ''
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: playwright-summary.json
          target: /var/www/html/La-Confianza/storage/app/monitor/
          overwrite: true

      # --------------------------------------------------
      # Validar resultado de pruebas
      # --------------------------------------------------

      - name: Detener pipeline si EC2 no responde
        if: steps.app_check.outcome == 'failure'
        run: |
          echo "::error::La aplicación no respondió en http://${{ secrets.EC2_HOST }}:8000"
          echo "Comprueba:"
          echo "1. Que la instancia EC2 esté encendida."
          echo "2. Que el contenedor esté ejecutándose."
          echo "3. Que el puerto 8000 esté abierto."
          echo "4. Que el Security Group permita conexiones."
          exit 1

      - name: Detener pipeline si Playwright falló
        if: steps.playwright.outcome == 'failure'
        run: |
          echo "::error::Las pruebas E2E de Playwright fallaron."
          echo "El despliegue ha sido cancelado."
          echo "Revisa el paso 'Ejecutar pruebas E2E'."
          echo "También puedes descargar el artefacto playwright-report."
          exit 1

      # --------------------------------------------------
      # Docker Login
      # --------------------------------------------------

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # --------------------------------------------------
      # Build Docker
      # --------------------------------------------------

      - name: Build Docker Image
        env:
          IMAGE_NAME: robertsl/la-confianza
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          docker build \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      # --------------------------------------------------
      # Push Docker Hub
      # --------------------------------------------------

      - name: Push Docker Hub
        env:
          IMAGE_NAME: robertsl/la-confianza
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"

      # --------------------------------------------------
      # Deploy EC2
      # --------------------------------------------------

      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: EXPECTED_COMMIT,RUN_STARTED_AT
          script: |
            set -Eeuo pipefail

            PROJECT_DIR="/var/www/html/La-Confianza"
            CONTAINER_NAME="la-confianza"

            cd "$PROJECT_DIR"

            # Verificar que sudo pueda utilizarse sin contraseña.
            sudo -n true

            # Crear las carpetas necesarias.
            sudo mkdir -p \
              storage \
              storage/app \
              storage/app/monitor \
              bootstrap/cache

            # Permitir temporalmente que el usuario de despliegue escriba.
            sudo chown -R "$USER":www-data \
              storage \
              bootstrap/cache

            sudo find storage bootstrap/cache \
              -type d \
              -exec chmod 2775 {} \;

            sudo find storage bootstrap/cache \
              -type f \
              -exec chmod 664 {} \;

            DEPLOY_LOG="storage/app/monitor/deploy.log"
            DEPLOY_META="storage/app/monitor/deploy.json"

            # El log se abre con sudo para conservar acceso al registrar fallos.
            sudo touch "$DEPLOY_LOG"
            sudo chown "$USER":www-data "$DEPLOY_LOG"
            sudo chmod 664 "$DEPLOY_LOG"
            exec > >(sudo tee "$DEPLOY_LOG") 2>&1

            write_failure_metadata() {
              EXIT_CODE="$?"

              set +e

              sudo tee "$DEPLOY_META" > /dev/null <<EOF
            {
              "status": "failure",
              "status_label": "El despliegue falló",
              "branch": "main",
              "commit": "${EXPECTED_COMMIT}",
              "updated_at": "${RUN_STARTED_AT}",
              "exit_code": ${EXIT_CODE}
            }
            EOF

              sudo chown www-data:www-data "$DEPLOY_META" 2>/dev/null || true
              sudo chmod 664 "$DEPLOY_META" 2>/dev/null || true

              echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] Deploy fallido"
              exit "$EXIT_CODE"
            }

            trap write_failure_metadata ERR

            echo "=========================================="
            echo "Deploy iniciado"
            echo "Fecha: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit esperado: ${EXPECTED_COMMIT}"
            echo "=========================================="

            echo "===== Información del repositorio ====="

            git remote get-url origin
            git status --short

            echo "===== Sincronizando código ====="

            git fetch --prune origin main
            git reset --hard origin/main

            # Eliminar archivos no versionados, conservando .env y monitor.
            git clean -fd \
              -e .env \
              -e storage/app/monitor \
              -e storage/app/monitor/

            ACTUAL_COMMIT="$(git rev-parse HEAD)"

            echo "Commit esperado:   ${EXPECTED_COMMIT}"
            echo "Commit desplegado: ${ACTUAL_COMMIT}"

            if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
              echo "ERROR: EC2 no quedó en el commit esperado."
              exit 1
            fi

            echo "===== Validando Docker Compose ====="

            docker compose config --quiet

            echo "===== Descargando imágenes ====="

            docker compose pull

            echo "===== Actualizando contenedores ====="

            docker compose up \
              -d \
              --force-recreate \
              --remove-orphans

            echo "===== Esperando contenedor Laravel ====="

            CONTAINER_READY=false

            for intento in $(seq 1 30); do
              RUNNING="$(
                docker inspect \
                  --format '{{.State.Running}}' \
                  "$CONTAINER_NAME" \
                  2>/dev/null || true
              )"

              if [ "$RUNNING" = "true" ]; then
                CONTAINER_READY=true
                echo "El contenedor está ejecutándose."
                break
              fi

              echo "Intento ${intento}/30: esperando contenedor..."
              sleep 2
            done

            if [ "$CONTAINER_READY" != "true" ]; then
              echo "ERROR: El contenedor ${CONTAINER_NAME} no inició."

              docker compose ps
              docker compose logs --tail=150

              exit 1
            fi

            echo "===== Verificando PHP ====="

            docker exec "$CONTAINER_NAME" php --version

            echo "===== Verificando Artisan ====="

            docker exec "$CONTAINER_NAME" php artisan --version

            echo "===== Limpiando caché Laravel ====="

            docker exec "$CONTAINER_NAME" \
              php artisan optimize:clear

            echo "===== Ejecutando migraciones ====="

            docker exec "$CONTAINER_NAME" \
              php artisan migrate --force

            echo "===== Generando cachés de producción ====="

            docker exec "$CONTAINER_NAME" \
              php artisan config:cache

            docker exec "$CONTAINER_NAME" \
              php artisan route:cache

            docker exec "$CONTAINER_NAME" \
              php artisan view:cache

            echo "===== Restaurando permisos Laravel ====="

            sudo chown -R www-data:www-data \
              storage \
              bootstrap/cache

            sudo find storage bootstrap/cache \
              -type d \
              -exec chmod 2775 {} \;

            sudo find storage bootstrap/cache \
              -type f \
              -exec chmod 664 {} \;

            echo "===== Estado de contenedores ====="

            docker compose ps

            echo "===== Últimos logs de Laravel ====="

            docker exec "$CONTAINER_NAME" \
              sh -c '
                if [ -f storage/logs/laravel.log ]; then
                  tail -n 30 storage/logs/laravel.log
                else
                  echo "Todavía no existe storage/logs/laravel.log"
                fi
              '

            echo "===== Registrando deploy exitoso ====="

            sudo tee "$DEPLOY_META" > /dev/null <<EOF
            {
              "status": "success",
              "status_label": "Deploy aplicado correctamente",
              "branch": "main",
              "commit": "${EXPECTED_COMMIT}",
              "updated_at": "${RUN_STARTED_AT}"
            }
            EOF

            sudo chown www-data:www-data "$DEPLOY_META"
            sudo chmod 664 "$DEPLOY_META"

            trap - ERR

            echo "=========================================="
            echo "Deploy finalizado correctamente"
            echo "Fecha: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit: ${EXPECTED_COMMIT}"
            echo "=========================================="
